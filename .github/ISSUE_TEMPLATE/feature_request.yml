name: Feature request
description: Suggest a focused improvement to the UFX+ GTK4 application.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction and expected result.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant interface and firmware
      placeholder: e.g. Fireface UFX+, firmware version
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is relevant to the UFX+ Linux/Class Compliant workflow.
          required: true
