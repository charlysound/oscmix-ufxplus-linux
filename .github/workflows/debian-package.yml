name: Debian package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Debian version, for example 0.1.0~alpha2-1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Debian package (Ubuntu 22.04, amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev \
            libavahi-client-dev libgtk-4-dev
      - name: Select package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            deb_version=$INPUT_VERSION
          else
            deb_version=${REF_NAME#v}
            deb_version=$(printf '%s' "$deb_version" |
              sed -e 's/-alpha\./~alpha/' -e 's/-beta\./~beta/' \
                  -e 's/-rc\./~rc/')
            deb_version=${deb_version}-1
          fi
          printf 'version=%s\n' "$deb_version" >> "$GITHUB_OUTPUT"
      - name: Build and inspect package
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./debian/build-deb.sh "$PACKAGE_VERSION"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sha256sum dist/*.deb > dist/SHA256SUMS
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscmix-ufxplus-debian-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
